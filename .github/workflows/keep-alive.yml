name: Keep Supabase alive

# Ruft regelmäßig die /api/keep-alive-Route auf, damit Supabase
# das Projekt nicht wegen Inaktivität pausiert.

on:
  schedule:
    # Täglich um 09:17 UTC. Zusammen mit Vercel Cron (zu anderer Uhrzeit)
    # haben wir zwei unabhängige Pings pro Tag — reichlich Puffer gegen
    # verzögerte oder ausgefallene Läufe.
    - cron: "17 9 * * *"
  # Erlaubt einen manuellen Start direkt aus der GitHub-Oberfläche
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive endpoint
        run: |
          set -e
          URL="https://doko-tracker-app.vercel.app/api/keep-alive"
          echo "Calling: $URL"
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" "$URL")
          http_code=$(echo "$response" | tail -n1 | sed 's/HTTP_STATUS://')
          body=$(echo "$response" | sed '$d')
          echo "Status: $http_code"
          echo "Body: $body"
          if [ "$http_code" != "200" ]; then
            echo "::error::Keep-alive returned non-200 status: $http_code"
            exit 1
          fi
          if ! echo "$body" | grep -q '"ok":true'; then
            echo "::error::Keep-alive did not return ok:true"
            exit 1
          fi
          echo "Keep-alive successful"
